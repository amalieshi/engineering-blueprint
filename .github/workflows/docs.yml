name: Build and Deploy Documentation

on:
  push:
    branches: [main]        # Auto-trigger on every commit merged to main
  pull_request:
    branches: [main]        # Auto-trigger on every commit pushed to a PR targeting main
  workflow_dispatch:         # Allow manual runs from the GitHub Actions UI

# Opt into Node.js 24 ahead of the June 2026 forced migration deadline
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Prevent overlapping deploys; let an in-progress run finish before a new one starts
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── Job 1: Compile Sphinx HTML ────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # Least privilege: only needs to read source

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip                             # Cache the pip resolver for faster CI runs

      - name: Configure GitHub Pages
        # Injects the correct absolute base_url into the build environment.
        # Required by the modern Pages API so asset paths resolve correctly.
        uses: actions/configure-pages@v5

      - name: Install documentation dependencies
        run: pip install .

      - name: Build Sphinx HTML
        # -n  promote missing references to warnings
        # -W  treat warnings as errors — enforces doc quality at the gate
        run: sphinx-build -b html -n -W . _build/html

      - name: Upload Pages artifact
        # Artifact upload only makes sense on a push to main.
        # Skipped on pull_request to avoid burning artifact storage on preview builds.
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  # ── Job 2: Publish to GitHub Pages ───────────────────────────────────────
  deploy:
    # Hard gate: only runs after a successful build on main.
    # Pull requests build and validate but never deploy.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write       # Required to publish to the Pages environment
      id-token: write    # Required for OIDC token exchange — no long-lived secrets

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
