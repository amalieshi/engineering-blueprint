[project]
name = "engineering-blueprint"
version = "1.0.0"
description = "Engineering framework and SOP library for Data Engineering and Software Development"
requires-python = ">=3.12"
dependencies = [
    "sphinx>=8.1",
    "furo>=2024.1.29",
    "myst-parser>=3.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-autobuild>=2024.0",
]

[build-system]
requires = ["setuptools>=72"]
build-backend = "setuptools.build_meta"
