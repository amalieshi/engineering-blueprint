# ============================================================
# pyproject.toml — Standard baseline for Python projects
# Replace all <placeholders> before use.
# ============================================================

[project]
name = "<project-name>"
version = "0.1.0"
description = "<One-line description of what this project does>"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"

authors = [
    { name = "Amalie Shi", email = "amalie.hui.shi@gmail.com" },
]

# Runtime dependencies only — dev tools go in [dependency-groups]
dependencies = [
    "structlog>=24.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=6.0.0",
    "mypy>=1.10.0",
    "ruff>=0.6.0",
    "pre-commit>=4.0.0",
]

# Add this group for async I/O projects
# async = [
#     "httpx>=0.27.0",
#     "anyio>=4.0.0",
# ]

# Add this group for data pipeline projects
# data = [
#     "polars>=1.0.0",
#     "pyarrow>=17.0.0",
#     "sqlalchemy[asyncio]>=2.0.0",
#     "asyncpg>=0.29.0",
# ]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/<package_name>"]

# ============================================================
# Ruff — linting and formatting
# ============================================================

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "ANN",  # flake8-annotations (type hints)
    "C90",  # mccabe complexity
    "N",    # pep8-naming
    "RUF",  # Ruff-specific rules
]
ignore = [
    "ANN101",   # Missing type for 'self' — unnecessary
    "ANN102",   # Missing type for 'cls' — unnecessary
    "S101",     # Use of assert — acceptable in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ANN",   # Type annotations not required in test files
    "S101",  # assert is the standard in pytest
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ============================================================
# mypy — static type checking
# ============================================================

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ============================================================
# pytest
# ============================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
markers = [
    "integration: marks tests that require external services (deselect with '-m not integration')",
    "slow: marks tests that take more than 1s to run",
]

# ============================================================
# Coverage
# ============================================================

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
